<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SharkTuner | Professional Guitar Tools</title>
    <link rel="stylesheet" href="style.css?v=2.7">
    <link rel="manifest" href="manifest.json?v=1.0">
    <meta name="theme-color" content="#0a0a0c">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
    <div class="glass-bg"></div>

    <header>
        <div class="header-content">
            <h1 class="retro-title">SHARK<span>TUNER</span></h1>
            <div class="status-indicator" id="audio-status"></div>
        </div>
    </header>

    <main id="app-container">
        <!-- View: Tuner (Default) -->
        <section id="view-tuner" class="view active">
            <div class="tuner-container">
                <div class="note-display">
                    <span id="target-note">--</span>
                    <span id="cents-offset">0.0</span>
                </div>

                <div class="gauge-container rectangular">
                    <div class="gauge-scale">
                        <span>-50</span>
                        <span>-25</span>
                        <span>0</span>
                        <span>+25</span>
                        <span>+50</span>
                    </div>
                    <div class="gauge-tracks"></div>
                    <div id="needle" class="needle"></div>
                </div>

                <div class="tuner-actions">
                    <button id="btn-start-tuner" class="btn-primary">POKRENI ŠTIMER</button>
                </div>
            </div>
        </section>

        <!-- View: Chords -->
        <section id="view-chords" class="view">
            <div class="library-container">
                <div class="library-controls">
                    <select id="chord-root" class="retro-select">
                        <option value="C">C</option>
                        <option value="C#">C#</option>
                        <option value="D">D</option>
                        <option value="D#">D#</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                        <option value="F#">F#</option>
                        <option value="G">G</option>
                        <option value="G#">G#</option>
                        <option value="A">A</option>
                        <option value="A#">A#</option>
                        <option value="B">B</option>
                    </select>
                    <select id="chord-type" class="retro-select">
                        <option value="major">DUR</option>
                        <option value="minor">MOL</option>
                        <option value="7">7</option>
                        <option value="maj7">maj7</option>
                        <option value="m7">m7</option>
                    </select>
                </div>

                <div class="dual-fretboard-container">
                    <div class="fretboard-wrapper">
                        <span class="fretboard-label">6. žica (debela) na VRHU</span>
                        <div class="fretboard-card">
                            <div id="chord-fretboard-thick" class="fretboard"></div>
                        </div>
                    </div>
                    <div class="fretboard-wrapper">
                        <span class="fretboard-label">1. žica (tanka) na VRHU</span>
                        <div class="fretboard-card">
                            <div id="chord-fretboard-thin" class="fretboard"></div>
                        </div>
                    </div>
                </div>

                <div class="chord-info">
                    <h3 id="chord-name">C Dur</h3>
                    <p id="chord-notes">C E G</p>
                </div>
            </div>
        </section>

        <!-- View: Scales -->
        <section id="view-scales" class="view">
            <div class="library-container">
                <div class="library-controls">
                    <select id="scale-root" class="retro-select">
                        <option value="C">C</option>
                        <option value="G">G</option>
                        <option value="D">D</option>
                        <option value="A">A</option>
                        <option value="E">E</option>
                        <option value="B">B</option>
                    </select>
                    <select id="scale-type" class="retro-select">
                        <option value="major_penta">Pentatonika (Dur)</option>
                        <option value="minor_penta">Pentatonika (Mol)</option>
                        <option value="blues">Blues Scale</option>
                    </select>
                </div>

                <div class="dual-fretboard-container">
                    <div class="fretboard-wrapper">
                        <span class="fretboard-label">6. žica (debela) na VRHU</span>
                        <div class="fretboard-card">
                            <div id="scale-fretboard-thick" class="fretboard"></div>
                        </div>
                    </div>
                    <div class="fretboard-wrapper">
                        <span class="fretboard-label">1. žica (tanka) na VRHU</span>
                        <div class="fretboard-card">
                            <div id="scale-fretboard-thin" class="fretboard"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="tab-bar">
        <button class="tab-btn active" data-view="tuner">
            <span class="icon">🎯</span>
            <span class="label">Štimer</span>
        </button>
        <button class="tab-btn" data-view="chords">
            <span class="icon">🎸</span>
            <span class="label">Akordi</span>
        </button>
        <button class="tab-btn" data-view="scales">
            <span class="icon">📐</span>
            <span class="label">Ljestvice</span>
        </button>
    </nav>

    <!-- Pitchy Library Fix -->
    <script type="module">
        import * as pitchy from 'https://esm.sh/pitchy@4';
        window.pitchy = pitchy;
    </script>
    <script src="app.js?v=2.7"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=2.7');
        }
    </script>
</body>

</html>
